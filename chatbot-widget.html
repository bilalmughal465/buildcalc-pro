<!-- BuildCalc chatbot widget SNIPPET — ye poora page NAHI hai, sirf snippet hai.
     ISE ABHI pages me mat lagana. Pehle:
     1. chatbot-worker.js ko Cloudflare Worker par deploy karo.
     2. Worker me GEMINI_API_KEY secret set karo (key yahan kabhi mat likhna).
     3. Neeche WORKER_URL ki jagah apne Worker ka URL daalo.
     4. Phir ye snippet har page ke </body> se pehle paste karo.
     Jab tak Worker live nahi, button dabane par "not set up yet" dikhega. -->
<div id="bc-chat" style="position:fixed;right:16px;bottom:16px;z-index:9999;font-family:system-ui,Arial,sans-serif">
  <button id="bc-open" style="background:#1c2226;color:#fff;border:0;border-bottom:4px solid #ffd60a;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer">Ask BuildCalc</button>
  <div id="bc-panel" style="display:none;width:320px;max-width:90vw;background:#fff;border:2px solid #1c2226;border-radius:8px;margin-top:8px;overflow:hidden">
    <div id="bc-msgs" style="height:280px;overflow-y:auto;padding:10px;font-size:15px;line-height:1.5"></div>
    <div style="display:flex;border-top:1px solid #d3d4cf">
      <input id="bc-in" type="text" placeholder="Ask about a calculator..." style="flex:1;border:0;padding:10px;font-size:15px;outline:0">
      <button id="bc-send" style="background:#1c2226;color:#fff;border:0;padding:10px 14px;font-weight:700;cursor:pointer">Send</button>
    </div>
  </div>
</div>
<script>
(function () {
  var WORKER_URL = "https://YOUR-WORKER.workers.dev"; // TODO: apne Worker ka URL yahan daalo
  var openBtn = document.getElementById("bc-open");
  var panel = document.getElementById("bc-panel");
  var msgs = document.getElementById("bc-msgs");
  var input = document.getElementById("bc-in");
  var sendBtn = document.getElementById("bc-send");
  function addMsg(text, who) {
    var p = document.createElement("p");
    p.style.margin = "0 0 8px";
    p.style.fontWeight = who === "you" ? "700" : "400";
    p.textContent = (who === "you" ? "You: " : "BuildCalc: ") + text;
    msgs.appendChild(p);
    msgs.scrollTop = msgs.scrollHeight;
  }
  openBtn.addEventListener("click", function () {
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  });
  async function send() {
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMsg(text, "you");
    if (WORKER_URL.indexOf("YOUR-WORKER") !== -1) {
      addMsg("Chatbot is not set up yet. Please use the calculators above.", "bot");
      return;
    }
    addMsg("Thinking...", "bot");
    try {
      var res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      var data = await res.json();
      msgs.lastChild.remove();
      addMsg(data.reply || "Sorry, I could not answer that.", "bot");
    } catch (e) {
      msgs.lastChild.remove();
      addMsg("Sorry, the chatbot is not available right now.", "bot");
    }
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
})();
</script>
