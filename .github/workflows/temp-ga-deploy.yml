name: temp-ga-deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and validate GA update zip
        run: |
          set -euo pipefail
          test -f buildcalc-ga-update.zip || { echo "ERROR: buildcalc-ga-update.zip not found on main"; exit 1; }
          rm -rf /tmp/newsite
          mkdir -p /tmp/newsite
          unzip -q buildcalc-ga-update.zip -d /tmp/newsite
          # Count ALL html pages recursively (not just the zip root)
          PAGES=$(find /tmp/newsite -name '*.html' | wc -l)
          echo "html_pages=$PAGES"
          test "$PAGES" -ge 4400 || { echo "ERROR: expected at least 4400 html pages, got $PAGES"; exit 1; }
          # Locate the site root (zip may wrap files in one top-level folder)
          if [ -f /tmp/newsite/index.html ]; then
            SRC=/tmp/newsite
          else
            SRC=$(dirname "$(find /tmp/newsite -maxdepth 4 -name index.html | head -1)")
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "site_root=$SRC"
          test -f "$SRC/index.html" || { echo "ERROR: no index.html found in extracted zip"; exit 1; }
          # GA gtag must be present on the pages
          GA=$(grep -rl 'G-ZJPZN2HK33' "$SRC" | wc -l)
          echo "pages_with_ga_id=$GA"
          test "$GA" -ge 4400 || { echo "ERROR: GA id G-ZJPZN2HK33 found on only $GA pages"; exit 1; }
          # Required unchanged files must exist in the zip
          for f in sitemap.xml robots.txt llms.txt BingSiteAuth.xml googleeeca7ce3e32d977b.html assets/universe.js _headers; do
            test -e "$SRC/$f" || { echo "ERROR: required file missing from zip: $f"; exit 1; }
          done
          echo "Validation passed."
      - name: Replace site files at repo root
        run: |
          set -euo pipefail
          test -n "${SRC:-}" || { echo "ERROR: SRC not set"; exit 1; }
          test -f "$SRC/index.html" || { echo "ERROR: site root invalid: $SRC"; exit 1; }
          # Stage removal of every tracked file except the zip and this workflow
          git ls-files -z | grep -zvE '^(buildcalc-ga-update\.zip|\.github/workflows/temp-ga-deploy\.yml)$' | xargs -0 -r git rm -q --ignore-unmatch
          # Drop any untracked leftovers (zip + workflow are tracked, so git clean cannot touch them)
          git clean -fdq
          # Copy the new site tree to the repo root
          cp -a "$SRC/." ./
          test -f index.html || { echo "ERROR: index.html missing at repo root after copy"; exit 1; }
          test -f BingSiteAuth.xml || { echo "ERROR: BingSiteAuth.xml missing at repo root after copy"; exit 1; }
          git add -A
          STAGED=$(git status --porcelain | wc -l)
          echo "staged_changes=$STAGED"
          test "$STAGED" -gt 0 || { echo "ERROR: nothing staged"; exit 1; }
      - name: Commit, remove zip and workflow, push
        run: |
          set -euo pipefail
          git config user.name "buildcalc-deploy"
          git config user.email "buildcalc-deploy@users.noreply.github.com"
          # Remove the uploaded zip and this temporary workflow from the repo.
          # rm -f + --ignore-unmatch avoids failing if either is already gone.
          rm -f buildcalc-ga-update.zip .github/workflows/temp-ga-deploy.yml
          git rm -q --ignore-unmatch buildcalc-ga-update.zip .github/workflows/temp-ga-deploy.yml
          git status --short | head -n 10 || true
          git commit -m "Deploy BuildCalc GA update (V48): unpack GA zip to root replacing old site, remove zip and temp workflow"
          git push origin HEAD:main
          echo "Pushed."
      - name: Deploy summary
        run: |
          echo "### Deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final commit hash: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit count on main: $(git rev-list --count HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- index.html at repo root: $(test -f index.html && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tracked files: $(git ls-files | wc -l)" >> "$GITHUB_STEP_SUMMARY"
