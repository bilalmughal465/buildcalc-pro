name: Deploy BuildCalc V49
on:
  push:
    branches: [main]
    paths:
      - 'buildcalc-v49-navy-gold-sci-hero-155fix.zip'
      - '.github/workflows/deploy-v49.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack V49 zip and replace site files
        run: |
          set -euo pipefail
          ZIP="buildcalc-v49-navy-gold-sci-hero-155fix.zip"
          WF=".github/workflows/deploy-v49.yml"
          if [ ! -f "$ZIP" ]; then
            echo "Zip not present; nothing to do."
            exit 0
          fi
          rm -rf /tmp/v49 && mkdir -p /tmp/v49
          unzip -o -q "$ZIP" -d /tmp/v49
          rm -rf /tmp/v49/__MACOSX
          SRC=/tmp/v49
          if [ ! -f "$SRC/index.html" ]; then
            CAND=$(find /tmp/v49 -maxdepth 2 -name index.html -print -quit)
            if [ -n "${CAND:-}" ]; then SRC="$(dirname "$CAND")"; fi
          fi
          if [ ! -f "$SRC/index.html" ]; then
            echo "ERROR: index.html not found in zip"
            find /tmp/v49 -maxdepth 2 | head -40
            exit 1
          fi
          if ! grep -q "mini-sci" "$SRC/index.html"; then
            echo "ERROR: mini-sci hero not found in index.html (wrong zip?)"
            exit 1
          fi
          N=$(find "$SRC" -name '*.html' | wc -l)
          echo "HTML files in zip (recursive): $N"
          echo "Top-level entries:"
          ls "$SRC" | head -30
          echo "Subdirectories:"
          find "$SRC" -maxdepth 2 -type d | head -40
          if [ "$N" -lt 4000 ]; then
            echo "ERROR: expected about 4440 html pages, found $N"
            exit 1
          fi
          for f in llms.txt robots.txt sitemap.xml; do
            if [ ! -f "$SRC/$f" ]; then
              echo "ERROR: $f missing from zip"
              exit 1
            fi
          done
          echo "Removing old tracked site files..."
          git ls-files -z | grep -zv '^\.github/' | xargs -0 -r git rm -q
          echo "Copying V49 files to repo root..."
          cp -r "$SRC/." .
          echo "Removing temporary workflow file (zip was already removed with old files)..."
          git rm -q "$WF"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git -c user.name="bilalmughal465" -c user.email="bilalmughal465@users.noreply.github.com" commit -m "Deploy BuildCalc V49 (unpack V49 zip to root, replace old site)"
          git push origin main
          echo "Pushed V49 deploy commit"
