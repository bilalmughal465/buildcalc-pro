name: Temp deploy - paint guide + trust page template fix

on:
  push:
    branches:
      - main
    paths:
      - buildcalc-v49-navy-gold-ux-batch-fixes-paint-guide-trust-page-template-fix.zip

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack ZIP and deploy to repo root
        run: |
          set -euo pipefail
          ZIP="buildcalc-v49-navy-gold-ux-batch-fixes-paint-guide-trust-page-template-fix.zip"
          WORKFLOW_FILE=".github/workflows/deploy-paint-trust-template-fix.yml"

          if [ ! -f "$ZIP" ]; then
            echo "Deploy ZIP not present in repo; nothing to do."
            exit 0
          fi

          rm -rf /tmp/newsite
          mkdir -p /tmp/newsite
          unzip -q "$ZIP" -d /tmp/newsite

          SRC="/tmp/newsite"
          if [ ! -f "$SRC/index.html" ]; then
            find "$SRC" -mindepth 1 -maxdepth 1 -type d > /tmp/topdirs.txt
            SRC=""
            while IFS= read -r d; do
              if [ -f "$d/index.html" ]; then
                SRC="$d"
                break
              fi
            done < /tmp/topdirs.txt
            if [ -z "$SRC" ]; then
              echo "ERROR: index.html not found in unzipped site"
              exit 1
            fi
          fi
          echo "Site root: $SRC"

          if ! grep -q 'mini-sci' "$SRC/index.html"; then
            echo "ERROR: index.html does not contain the 'mini-sci' marker"
            exit 1
          fi
          find "$SRC" -type f -name '*.html' > /tmp/htmlfiles.txt
          HTML_COUNT="$(wc -l < /tmp/htmlfiles.txt | tr -d ' ')"
          echo "HTML pages in new build: $HTML_COUNT"
          if [ "$HTML_COUNT" -lt 4000 ]; then
            echo "ERROR: expected at least 4000 HTML pages, found $HTML_COUNT"
            exit 1
          fi
          for req in llms.txt robots.txt sitemap.xml; do
            if [ ! -f "$SRC/$req" ]; then
              echo "ERROR: required file $req missing from new build"
              exit 1
            fi
          done
          echo "All guards passed."

          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name "$ZIP" -exec rm -rf {} +

          cp -a "$SRC/." .

          rm -f "$WORKFLOW_FILE" "$ZIP"

          git config user.name "bilalmughal465"
          git config user.email "bilalmughal465@users.noreply.github.com"
          git add -A
          git status --short > /tmp/deploystatus.txt
          cat /tmp/deploystatus.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy paint guide + trust page template fix (v49 navy-gold UX batch fixes)"
            git push origin HEAD:main
          fi
